# ALL DATA IN THIS FILE IS FICTIONAL. The policies, sources and scores are
# invented test data and do not describe any real policy or publication.

rubric:
  label: v1
  min_ratings: 5

aspects:
  - code: outcome_failure
    name: Outcome Failure
    weight: 1
    definition: "How far official results fall short of the policy's own stated targets."
  - code: cost_waste
    name: Cost & Waste
    weight: 1
    definition: "Spending beyond budget, delay-driven cost, leakage or misuse of funds."
  - code: transparency_gap
    name: Transparency Gap
    weight: 1
    definition: "Information that should be public but is missing, withheld or contradicted."
  - code: ground_level_harm
    name: Ground-Level Harm
    weight: 1
    definition: "Documented negative effects on people where the policy is delivered."
  - code: legal_challenges
    name: Legal Challenges
    weight: 1
    definition: "Court cases and rulings against or questioning the policy."
  - code: equity_impact
    name: Equity Impact
    weight: 1
    definition: "Unequal burden or side effects on particular groups, regions or sectors."

