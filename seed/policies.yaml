# Real government policies. No scores or evidence are typed here: scores come
# only from the scoring pipeline (see docs/scoring-method.md).
# Summaries are neutral placeholders; verify each against an official source.

rubric:
  label: v1
  min_ratings: 5

aspects:
  - code: outcome_failure
    name: Outcome Failure
    weight: 1
    definition: "How far official results fall short of the policy's own stated targets."
  - code: cost_waste
    name: Cost & Waste
    weight: 1
    definition: "Spending beyond budget, delay-driven cost, leakage or misuse of funds."
  - code: transparency_gap
    name: Transparency Gap
    weight: 1
    definition: "Information that should be public but is missing, withheld or contradicted."
  - code: ground_level_harm
    name: Ground-Level Harm
    weight: 1
    definition: "Documented negative effects on people where the policy is delivered."
  - code: legal_challenges
    name: Legal Challenges
    weight: 1
    definition: "Court cases and rulings against or questioning the policy."
  - code: equity_impact
    name: Equity Impact
    weight: 1
    definition: "Unequal burden or side effects on particular groups, regions or sectors."

policies:
  - slug: demonetisation-2016
    name: Demonetisation
    year: 2016
    summary: "On 8 November 2016 the Government of India withdrew the legal tender status of 500 and 1,000 rupee banknotes and began replacing them with new 500 and 2,000 rupee notes."
    indicators: []

  - slug: gst-rollout-2017
    name: Goods and Services Tax rollout
    year: 2017
    summary: "From 1 July 2017 the Goods and Services Tax replaced many separate central and state indirect taxes with one tax collected at several rate slabs."
    indicators: []

  - slug: farm-laws-2020
    name: Farm laws (repealed)
    year: 2020
    summary: "Three laws passed in September 2020 changed rules on selling farm produce outside regulated markets, on contract farming, and on stock limits for essential commodities. They were repealed in 2021."
    indicators: []

  - slug: agnipath-scheme-2022
    name: Agnipath recruitment scheme
    year: 2022
    summary: "Announced in June 2022, the scheme recruits armed forces personnel below officer rank for a fixed four-year term, after which a limited share are retained for longer service."
    indicators: []

  - slug: electoral-bonds-scheme-2018
    name: Electoral Bonds scheme
    year: 2018
    summary: "Introduced in 2018, the scheme let donors buy bearer bonds from an authorised bank and give them to political parties without the donor's name appearing on the bond. The Supreme Court struck it down in February 2024."
    indicators: []

  - slug: dpdp-act-2023
    name: Digital Personal Data Protection Act
    year: 2023
    summary: "Enacted in August 2023, the Act sets rules for how digital personal data of individuals in India is processed, and creates rights and duties for data principals and data fiduciaries."
    indicators: []

  - slug: telecommunications-act-2023
    name: Telecommunications Act
    year: 2023
    summary: "Passed in December 2023, the Act replaces the Indian Telegraph Act of 1885 and related laws, and includes provisions on licensing, spectrum and the suspension of telecommunication services in specified circumstances."
    indicators: []

  - slug: spectrum-allocation-2g-2008
    name: 2G spectrum first-come-first-served allocation
    year: 2008
    summary: "In 2008 telecom licences and 2G spectrum were allotted on a first-come-first-served basis. In February 2012 the Supreme Court quashed the 122 licences granted in that process."
    indicators: []